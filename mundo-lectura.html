<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mundo Lectura 📚</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Georgia, serif; text-align: center; background: linear-gradient(#ffe5ec, #ffc8dd); margin: 0; }
    h1 { color: #2c3e50; margin-top: 40px; }
    p { font-size: 18px; color: #34495e; }
    .opcion {
      display: inline-block;
      background: #ff6f61;
      color: white;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 18px;
      margin: 10px;
      cursor: pointer;
    }
    .opcion:hover { background: #e63946; }
    #historia { margin-top: 30px; font-size: 20px; }
  </style>
</head>
<body>
  <h1>📚 Bienvenidos al Mundo Lectura 📚</h1>
  <p>Hoy leeremos un cuento interactivo: <strong>El bosque mágico</strong></p>

  <div id="historia">
    Había una vez un bosque lleno de árboles que susurraban historias. 
    Un niño curioso entró y escuchó dos caminos posibles...
  </div>

  <div>
    <div class="opcion" onclick="continuar('luz')">Seguir la luz brillante ✨</div>
    <div class="opcion" onclick="continuar('sonido')">Seguir el sonido misterioso 🔊</div>
  </div>

  <div id="final"></div>

  <script>
    function continuar(eleccion) {
      if(eleccion === 'luz') {
        document.getElementById("final").innerHTML = "🌟 El niño encontró un claro lleno de luciérnagas que le enseñaron canciones mágicas.";
      } else {
        document.getElementById("final").innerHTML = "🌲 El niño descubrió un árbol sabio que le contó historias antiguas del bosque.";
      }
    }
  </script>
</body>
</html>
